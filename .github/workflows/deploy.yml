name: Deploy (producción)

# Autodeploy a Vercel SOLO cuando el workflow "CI" termina en éxito sobre `main`.
# `workflow_run` encadena este deploy a la validación de CI: si CI falla, no despliega.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel → producción
    runs-on: ubuntu-latest
    # Solo si CI pasó (no en fallo ni cancelación).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Comprobar secretos de Vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Faltan secretos. Define VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID en Settings → Secrets → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull de configuración de producción
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build de producción
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Desplegar artefacto prebuilt
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deploy OK::$URL"
