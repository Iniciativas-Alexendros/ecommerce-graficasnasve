name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11'
  SHA_DEPLOY_CACHE: ${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    name: Quality - Typecheck · Lint · Unit tests
    runs-on: [self-hosted, ts]
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify npmrc
        run: |
          cat .npmrc
          echo "node_modules/.bin added to PATH: ${{ env.PATH }}"

      - name: Install dependencies
        run: |
          echo "Installando dependencias con pnpm..."
          pnpm install --frozen-lockfile
          echo "✓ Dependencias instaladas"

      - name: Typecheck (strict)
        run: |
          echo "Ejecutando verificación de tipos (...)"
          pnpm typecheck
          echo "✓ Typecheck completado"

      - name: Linting
        run: |
          echo "Ejecutando linting..."
          pnpm lint
          echo "✓ Linting completado"

      - name: Unit tests
        run: |
          echo "Ejecutando tests unitarios..."
          pnpm test
          echo "✓ Tests unitarios completados"

      - name: Format check
        run: |
          echo "Verificando formato de código..."
          pnpm format:check
          echo "✓ Verificación de formato completada"

      - name: Store artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-artifacts
          path: |
            .next/
            dist/
            coverage/
            .turbo/
          retention-days: 1

  e2e:
    name: E2E - Playwright (Chromium)
    runs-on: [self-hosted, ts]
    needs: quality
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'bot'
    environment:
      name: preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          echo "Installando dependencias para pruebas E2E..."
          pnpm install --frozen-lockfile
          echo "✓ Dependencias instaladas"

      - name: Build application
        run: |
          echo "Construyendo aplicación..."
          pnpm build
          echo "✓ Construcción completada"

      - name: Setup Playwright
        run: |
          echo "Configurando Playwright browsers..."
          pnpm exec playwright install --with-deps chromium
          echo "✓ Playwright browsers instalados"

      - name: Run E2E tests
        run: |
          echo "Ejecutando tests E2E..."
          pnpm test:e2e
          echo "✓ Tests E2E completados"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  notify:
    name: Notify results
    runs-on: [self-hosted, ts]
    needs: [quality, e2e]
    if: always() && (success() || failure())
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4 # v4.6.2
        with:
          path: artifacts

      - name: Display results
        run: |
          echo "=== Workflow Summary ==="
          echo "Status: ${{ needs.quality.result == 'success' && needs.e2e.result == 'success' && 'SUCCESS' || 'FAILURE' }}"
          echo "Quality job: ${{ needs.quality.result }}"
          echo "E2E job: ${{ needs.e2e.result }}"
          echo "Workspace artifactet available in artifacts/"
          ls -la artifacts/
